[build]
  command = "npm run build"
  publish = "dist"

# 1. Forward all backend API requests to your hosted server
[[redirects]]
  from = "/api/*"
  to = "https://chronx.netlify.app/api/:splat"
  status = 200
  force = true

# 2. Client-side routing fallback (keeps react-router working)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
